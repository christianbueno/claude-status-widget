<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Status</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">

    <!-- ── COLLAPSED PILL ─────────────────────────────── -->

        </g>
      </svg>
      <span id="pill-dot" class="dot"></span>
      <span id="pill-text" class="pill-text">Checking…</span>
      <div class="pill-controls no-drag">
        <button id="btn-minimize-pill" class="icon-btn" title="Minimize to tray" aria-label="Minimize to tray">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="4" y1="8" x2="12" y2="8"/>
          </svg>
        </button>
        <button id="btn-refresh" class="icon-btn" title="Refresh">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2"/>
            <polyline points="12 2 12.9 4.8 10 5"/>
          </svg>
        </button>
        <button id="btn-toggle" class="icon-btn chevron-btn" title="Expand">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 4 10 8 6 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── EXPANDED PANEL ─────────────────────────────── -->
    <div id="panel" class="panel hidden">

      <div class="panel-header drag">
        <div class="header-left">
          <svg class="claude-icon" viewBox="-2 -2 168 152">
            <g transform="translate(-75.96,-223.53)">
              <path d="m 105.01,322.07 29.14,-16.35 0.49,-1.42 -0.49,-0.79 h -1.42 l -4.87,-0.3 -16.65,-0.45 -14.44,-0.6 -13.99,-0.75 -3.52,-0.75 -3.3,-4.35 0.34,-2.17 2.96,-1.99 4.24,0.37 9.37,0.64 14.06,0.97 10.2,0.6 15.11,1.57 h 2.4 l 0.34,-0.97 -0.82,-0.6 -0.64,-0.6 -14.55,-9.86 -15.75,-10.42 -8.25,-6 -4.46,-3.04 -2.25,-2.85 -0.97,-6.22 4.05,-4.46 5.44,0.37 1.39,0.37 5.51,4.24 11.77,9.11 15.37,11.32 2.25,1.87 0.9,-0.64 0.11,-0.45 -1.01,-1.69 -8.36,-15.11 -8.92,-15.37 -3.97,-6.37 -1.05,-3.82 c -0.37,-1.57 -0.64,-2.89 -0.64,-4.5 l 4.61,-6.26 2.55,-0.82 6.15,0.82 2.59,2.25 3.82,8.74 6.19,13.76 9.6,18.71 2.81,5.55 1.5,5.14 0.56,1.57 h 0.97 v -0.9 l 0.79,-10.54 1.46,-12.94 1.42,-16.65 0.49,-4.69 2.32,-5.62 4.61,-3.04 3.6,1.72 2.96,4.24 -0.41,2.74 -1.76,11.44 -3.45,17.92 -2.25,12 h 1.31 l 1.5,-1.5 6.07,-8.06 10.2,-12.75 4.5,-5.06 5.25,-5.59 3.37,-2.66 h 6.37 l 4.69,6.97 -2.1,7.2 -6.56,8.32 -5.44,7.05 -7.8,10.5 -4.87,8.4 0.45,0.67 1.16,-0.11 17.62,-3.75 9.52,-1.72 11.36,-1.95 5.14,2.4 0.56,2.44 -2.02,4.99 -12.15,3 -14.25,2.85 -21.22,5.02 -0.26,0.19 0.3,0.37 9.56,0.9 4.09,0.22 h 10.01 l 18.64,1.39 4.87,3.22 2.92,3.94 -0.49,3 -7.5,3.82 -10.12,-2.4 -23.62,-5.62 -8.1,-2.02 h -1.12 v 0.67 l 6.75,6.6 12.37,11.17 15.49,14.4 0.79,3.56 -1.99,2.81 -2.1,-0.3 -13.61,-10.24 -5.25,-4.61 -11.89,-10.01 h -0.79 v 1.05 l 2.74,4.01 14.47,21.75 0.75,6.67 -1.05,2.17 -3.75,1.31 -4.12,-0.75 -8.47,-11.89 -8.74,-13.39 -7.05,-12 -0.86,0.49 -4.16,44.81 -1.95,2.29 -4.5,1.72 -3.75,-2.85 -1.99,-4.61 1.99,-9.11 2.4,-11.89 1.95,-9.45 1.76,-11.74 1.05,-3.9 -0.07,-0.26 -0.86,0.11 -8.85,12.15 -13.46,18.19 -10.65,11.4 -2.55,1.01 -4.42,-2.29 0.41,-4.09 2.47,-3.64 14.74,-18.75 8.89,-11.62 5.74,-6.71 -0.04,-0.97 h -0.34 l -39.15,25.42 -6.97,0.9 -3,-2.81 0.37,-4.61 1.42,-1.5 11.77,-8.1 -0.04,0.04 z"/>
            </g>
          </svg>
          <div>
            <div class="header-title">Claude Status</div>
            <div class="header-desc-row">
              <span id="panel-dot" class="dot"></span>
              <span id="panel-desc" class="header-desc">—</span>
            </div>
          </div>
        </div>
        <div class="header-right no-drag">
          <button id="btn-minimize" class="icon-btn" title="Minimize to tray" aria-label="Minimize to tray">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="4" y1="8" x2="12" y2="8"/>
            </svg>
          </button>
          <button id="btn-refresh-panel" class="icon-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2"/>
              <polyline points="12 2 12.9 4.8 10 5"/>
            </svg>
          </button>
          <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="2.5"/>
              <path d="M13.3 10a1.2 1.2 0 0 0 .24 1.32l.04.04a1.44 1.44 0 1 1-2.04 2.04l-.04-.04a1.2 1.2 0 0 0-1.32-.24 1.2 1.2 0 0 0-.72 1.08v.12a1.44 1.44 0 1 1-2.88 0v-.06a1.2 1.2 0 0 0-.78-1.08 1.2 1.2 0 0 0-1.32.24l-.04.04a1.44 1.44 0 1 1-2.04-2.04l.04-.04a1.2 1.2 0 0 0 .24-1.32 1.2 1.2 0 0 0-1.08-.72H1.44a1.44 1.44 0 0 1 0-2.88h.06A1.2 1.2 0 0 0 2.58 5.6a1.2 1.2 0 0 0-.24-1.32l-.04-.04a1.44 1.44 0 1 1 2.04-2.04l.04.04A1.2 1.2 0 0 0 5.7 2.48h.06V1.44a1.44 1.44 0 0 1 2.88 0v.06a1.2 1.2 0 0 0 .72 1.08 1.2 1.2 0 0 0 1.32-.24l.04-.04a1.44 1.44 0 1 1 2.04 2.04l-.04.04a1.2 1.2 0 0 0-.24 1.32v.06h.12a1.44 1.44 0 0 1 0 2.88h-.12a1.2 1.2 0 0 0-1.08.72z"/>
            </svg>
          </button>
          <button id="btn-ext" class="icon-btn" title="Open status page">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9"/>
              <polyline points="10 2 14 2 14 6"/>
              <line x1="14" y1="2" x2="7" y2="9"/>
            </svg>
          </button>
          <button id="btn-close" class="icon-btn" title="Collapse">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="10 4 6 8 10 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="panel-body">

        <!-- Components -->
        <div class="section">
          <div class="section-label">Components</div>
          <div id="components"></div>
        </div>

        <!-- Active Incidents -->
        <div id="incidents-section" class="section hidden">
          <div class="divider"></div>
          <div class="section-label">Active Incidents</div>
          <div id="incidents"></div>
        </div>

      </div>

      <!-- ── SETTINGS ──────────────────────────────────── -->
      <div id="settings" class="settings-section hidden">
        <div class="settings-row">
          <span class="settings-label">Theme</span>
          <div id="theme-toggle" class="segmented-control">
            <button class="seg-btn" data-theme="dark">Dark</button>
            <button class="seg-btn active" data-theme="system">System</button>
            <button class="seg-btn" data-theme="light">Light</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label">Position</span>
          <button id="btn-reset-pos" class="settings-action-btn">Reset to default</button>
        </div>
      </div>

      <div class="panel-footer">
        <span id="updated-at" class="footer-time">—</span>
        <button id="btn-quit" class="quit-btn">Quit</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
